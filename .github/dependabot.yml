version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1 # Wait for one day after release before updating a dependency
    groups:
      patch-and-minor-actions:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1 # Wait for one day after release before updating a dependency
    groups:
      # Our packages depend on each other through peer dependencies,
      # so they need to be updated together in a single pull request.
      # Majors are included for that reason: they often move as a set.
      amsterdam-design-system:
        applies-to: "version-updates"
        patterns:
          - "@amsterdam/design-system-*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      patch-and-minor-dependencies:
        applies-to: "version-updates"
        exclude-patterns:
          - "@amsterdam/design-system-*"
        update-types:
          - "patch"
          - "minor"
    versioning-strategy: "increase-if-necessary"
    open-pull-requests-limit: 20
