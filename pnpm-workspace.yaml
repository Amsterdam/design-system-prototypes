packages:
  - '.'
# next pulls in postcss 8.4.31, which is vulnerable to GHSA-qx2v-qp2m-jg93
# (XSS via an unescaped </style> in its stringify output). Force the patch.
overrides:
  postcss: '^8.5.10'
allowBuilds:
  sharp: true
  unrs-resolver: true
# Amsterdam's own packages are trusted, so exempt them from the
# minimumReleaseAge supply-chain policy (otherwise freshly published
# ADS releases block `pnpm ci` in CI for ~24h after publish).
minimumReleaseAgeExclude:
  - '@amsterdam/*'
  - '@typescript-eslint/parser@8.64.0'
  - '@typescript-eslint/project-service@8.64.0'
  - '@typescript-eslint/scope-manager@8.64.0'
  - '@typescript-eslint/tsconfig-utils@8.64.0'
  - '@typescript-eslint/types@8.64.0'
  - '@typescript-eslint/typescript-estree@8.64.0'
  - '@typescript-eslint/visitor-keys@8.64.0'
