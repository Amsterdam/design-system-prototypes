packages:
  - '.'
# next pulls in postcss 8.4.31, which is vulnerable to GHSA-qx2v-qp2m-jg93
# (XSS via an unescaped </style> in its stringify output). Force the patch.
overrides:
  postcss: '^8.5.10'
allowBuilds:
  sharp: true
  unrs-resolver: true
# Exempt packages from the minimumReleaseAge supply-chain policy, which
# otherwise blocks `pnpm ci` in CI for ~24h after a version is published.
# '@amsterdam/*' are our own, trusted packages. The '@typescript-eslint/*'
# 8.64.0 entries are pinned toolchain versions that were freshly published
# when bumped, and are exempted so a new release doesn't stall CI.
minimumReleaseAgeExclude:
  - '@amsterdam/*'
  - '@typescript-eslint/parser@8.64.0 || 8.72.2'
  - '@typescript-eslint/project-service@8.64.0 || 8.72.2'
  - '@typescript-eslint/scope-manager@8.64.0 || 8.72.2'
  - '@typescript-eslint/tsconfig-utils@8.64.0 || 8.72.2'
  - '@typescript-eslint/types@8.64.0 || 8.72.2'
  - '@typescript-eslint/typescript-estree@8.64.0 || 8.72.2'
  - '@typescript-eslint/visitor-keys@8.64.0 || 8.72.2'
  - '@next/env@16.4.6'
  - '@next/eslint-plugin-next@16.4.6'
  - '@next/swc-darwin-arm64@16.4.6'
  - '@next/swc-darwin-x64@16.4.6'
  - '@next/swc-linux-arm64-gnu@16.4.6'
  - '@next/swc-linux-arm64-musl@16.4.6'
  - '@next/swc-linux-x64-gnu@16.4.6'
  - '@next/swc-linux-x64-musl@16.4.6'
  - '@next/swc-win32-arm64-msvc@16.4.6'
  - '@next/swc-win32-x64-msvc@16.4.6'
  - eslint-config-next@16.4.6
  - next@16.4.6
